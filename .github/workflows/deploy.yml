name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Publicar no servidor
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar credenciais do banco
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          config = Path("config.php")
          contents = config.read_text(encoding="utf-8")
          for name in ("DB_HOST", "DB_NAME", "DB_USER", "DB_PASS"):
              value = os.environ.get(name, "")
              if not value:
                  raise SystemExit(f"Required GitHub secret {name} is not configured")
              escaped = value.replace("\\", "\\\\").replace("'", "\\'")
              contents = contents.replace(f"__{name}__", escaped)
          config.write_text(contents, encoding="utf-8")
          PY

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /mathplay.totalh.net/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/database/mathplay.db
